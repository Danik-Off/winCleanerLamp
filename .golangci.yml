version: "2"
run:
  go: "1.21"
linters:
  enable:
    - misspell
    - nakedret
    - prealloc
    - revive
    - unconvert
    - unparam
    - whitespace
  settings:
    revive:
      rules:
        - name: blank-imports
          disabled: false
        - name: context-as-argument
          disabled: false
        - name: var-declaration
          disabled: false
        - name: package-comments
          disabled: true
        - name: exported
          arguments:
            - checkPrivateReceivers
            - disableStutteringCheck
          disabled: false
        - name: indent-error-flow
          disabled: false
        - name: unexported-return
          disabled: false
        - name: unused-parameter
          disabled: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - gui/node_modules
      - vendor
      - third_party
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/suzen/wincleanerlamp
  exclusions:
    generated: lax
    paths:
      - gui/node_modules
      - vendor
      - third_party
      - third_party$
      - builtin$
      - examples$
