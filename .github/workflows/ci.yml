name: CI

# Проверка на каждый push и PR — раньше проверки (go vet/test, tsc) были
# только внутри release.yml, то есть проблема обнаруживалась лишь в момент
# релиза. Здесь та же проверка запускается на каждое изменение, до релиза.
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # .golangci.yml существовал в репозитории, но раньше не был подключён
    # ни к одному workflow — golangci-lint запускался только вручную (make lint),
    # если разработчик о нём вспоминал.
    #
    # Матрица по GOOS: файлы *_windows.go / *_linux.go / *_darwin.go
    # компилируются только под свою ОС, поэтому один прогон линтера проверил
    # бы лишь одно ядро из трёх.
    name: 'Go — golangci-lint (${{ matrix.goos }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, linux, darwin]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Для линтера нужен свежий тулчейн: golangci-lint v2.13 собран с Go 1.26
      # и поддерживает только две последние версии Go — с 1.21 (как в
      # остальных джобах) он не может загрузить пакеты и падает. Код при этом
      # по-прежнему соответствует `go 1.21` из go.mod (run.go в .golangci.yml).
      - name: Go — установка
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: golangci-lint
        # Версия action и версия линтера зафиксированы намеренно: конфиг в
        # формате v2 читают только action v7+ и golangci-lint v2, а плавающий
        # `latest` однажды уже сломал этот шаг сменой мажорной версии.
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
        env:
          GOOS: ${{ matrix.goos }}

  verify:
    name: 'Windows: ядро + GUI'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Go — установка
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Node.js — установка
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Go — vet
        run: go vet ./...

      - name: Go — тесты (internal/cleaner)
        run: go test ./internal/cleaner/... -short

      - name: Go — сборка ядра Windows
        run: go build -ldflags "-s -w" -o win-cleaner-lamp.exe ./wincli

      - name: GUI — npm ci
        working-directory: gui
        run: npm ci

      - name: GUI — проверка типов (renderer)
        working-directory: gui
        run: npx tsc --noEmit

      - name: GUI — проверка типов (electron)
        working-directory: gui
        run: npx tsc -p tsconfig.electron.json --noEmit

      - name: GUI — сборка (tsc + Vite + Electron main)
        working-directory: gui
        run: npm run build

  verify-linux:
    name: 'Linux: ядро + GUI (AppImage)'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Go — установка
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Node.js — установка
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Кэш бинарников Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('gui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Go — vet
        run: go vet ./...

      - name: Go — тесты (internal/cleaner)
        run: go test ./internal/cleaner/... -short

      - name: Go — сборка ядра Linux
        run: go build -ldflags "-s -w" -o lin-cleaner-lamp ./lincli

      # Дымовая проверка: ядро должно отдавать список категорий в JSON —
      # именно этим вызовом начинает работу GUI.
      - name: Ядро — --list --json
        run: ./lin-cleaner-lamp --list --json > /dev/null

      - name: GUI — npm ci
        working-directory: gui
        run: npm ci

      # Упаковка Linux-GUI раньше вообще не проверялась — релиз под Linux
      # ломался молча. Собираем только AppImage: deb/rpm используют тот же
      # app-каталог, а rpm ещё и требует rpmbuild — оставлено release.yml.
      - name: GUI — сборка и упаковка AppImage
        working-directory: gui
        run: npm run verify:cli && npm run build && npx electron-builder --linux AppImage --publish never

      - name: Ядро внутри AppImage
        run: |
          ls -la gui/dist-release/*.AppImage
          ls gui/dist-release/linux-unpacked/resources/lin-cleaner-lamp gui/dist-release/linux-unpacked/resources/orphaned_apps.linux.json

  verify-macos:
    name: 'macOS: ядро maccli'
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Go — установка
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Go — vet
        run: go vet ./...

      - name: Go — тесты (internal/cleaner)
        run: go test ./internal/cleaner/... -short

      - name: Go — сборка ядра macOS
        run: go build -ldflags "-s -w" -o mac-cleaner-lamp ./maccli

      - name: Ядро — --list --json
        run: ./mac-cleaner-lamp --list --json > /dev/null

  cross-vet:
    name: 'Кросс-проверка трёх ядер'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Go — установка
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # Файлы *_windows.go / *_linux.go / *_darwin.go компилируются только
      # под свою ОС: без этого шага поломка в чужом ядре осталась бы
      # незамеченной до сборки релиза.
      - name: vet под все три ОС
        run: |
          GOOS=windows go vet ./...
          GOOS=linux go vet ./...
          GOOS=darwin go vet ./...
