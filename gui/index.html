<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    Строгий CSP: рендерер — локальный file:// (или localhost в dev), внешние
    сети не нужны. default-src 'none' + явные разрешения — без unsafe-inline
    для script-src (style-src 'unsafe-inline' нужен MUI/emotion, который
    вставляет стили через <style> теги в рантайме).
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none';" />
  <title>WinCleanerLamp GUI</title>
  <style>
    html, body, #root {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
